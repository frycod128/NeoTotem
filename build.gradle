plugins {
    // java-library 提供编译、测试和 JAR 任务；maven-publish 用于发布 Maven 制品。
    id 'java-library'
    id 'maven-publish'
    // ModDevGradle 负责准备 Minecraft/NeoForge 开发环境及各类运行配置。
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    /*
     * 在这里固定 Wrapper 类型，更新 Wrapper 时无需重复传命令行参数。
     * BIN 只下载运行 Gradle 所需内容；改成 ALL 会额外下载源码和文档，IDE 悬停提示更完整，
     * 但下载体积更大。切换到 ALL 后应连续运行两次 wrapper 任务，再检查
     * gradle/wrapper/gradle-wrapper.properties 是否已指向 -all 包。
     */
    distributionType = Wrapper.DistributionType.BIN
}

// 这两个值来自 gradle.properties，也会成为最终 Maven/JAR 坐标的一部分。
version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // 将数据生成器的输出视为主资源；runData 生成的文件因此会自动打入正式 JAR。
    srcDir('src/generated/resources')

    // 开发源文件不应进入发布包。
    exclude("**/*.bbmodel") // Blockbench 工程文件
    exclude("src/generated/**/.cache") // 数据生成器的增量缓存
}

repositories {
    // 仅当下面声明的第三方依赖不在默认仓库时，才在此添加对应 Maven 仓库。
}

base {
    // 最终文件名以模组 ID 开头，例如 immortalitytotem-1.0.0.jar。
    archivesName = mod_id
}

// Minecraft 26.2 面向玩家附带 Java 25，因此模组也应以 Java 25 为目标版本。
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // 要使用的 NeoForge 精确版本，来自 gradle.properties。
    version = project.neo_version

    // Access Transformer 通常可被自动发现；仅在路径非默认时显式指定。
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    /*
     * IDE 和命令行使用的开发运行配置。每个配置默认以 run 目录为游戏目录，
     * 但它们的用途、物理侧和启动参数不同。
     */
    runs {
        client {
            client()
            // 逗号分隔的 GameTest 命名空间；使用本模组 ID 可避免运行无关模组的测试。
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // 开发专用运行期断言；正式 JAR 中未设置此属性，因此不会执行。
            systemProperty 'immortalitytotem.selfTest', 'true'
        }

        /*
         * 专用 GameTestServer 会执行已注册测试并自动退出。
         * 若项目没有任何 GameTest，该运行配置默认会以错误结束，这是预期行为。
         */
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            // 26.2 的 clientData 同时准备客户端与服务端数据生成环境。
            clientData()
            // 如需让数据生成使用独立游戏目录，可取消下一行注释。
            // gameDirectory = project.file('run-data')

            /*
             * --mod：只运行本模组的数据提供器；--all：生成所有侧的数据；
             * --output：写入生成资源目录；--existing：把手写主资源作为已有资源参与解析。
             */
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // 对上面的所有运行配置应用统一的开发日志设置。
        configureEach {
            /*
             * NeoForge 日志标记以逗号分隔：SCAN 用于模组扫描，REGISTRIES 用于注册事件，
             * REGISTRYDUMP 会输出完整注册表，信息量很大，只建议排查问题时启用。
             */
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // DEBUG 适合开发；发布后的玩家日志等级由其运行环境决定。
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        /*
         * 把模组 ID 与源码集绑定。单模组项目只有一项；同一工程包含多个模组时，
         * 应为每个模组分别声明并绑定相应 sourceSet。
         */
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

/*
 * localRuntime 用于“仅在本地开发运行时存在”的可选依赖。
 * 它会加入 runtimeClasspath，但不会像普通 runtimeOnly 那样被错误发布为传递依赖。
 */
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    /*
     * 可选 JEI 依赖示例：编译只需要 API，开发运行则加载完整模组。
     * 使用 localRuntime 可避免发布时强制下游同时依赖 JEI。
     */
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    /*
     * 从 ./libs 使用本地模组 JAR 的示例。flatDir 方式会忽略 group，
     * 因而还需在 repositories 中配置 flatDir；通常更推荐 Maven 坐标。
     */
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // 直接按文件声明依赖的示例。
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // 多模块 Gradle 工程中引用同级/子项目的示例。
    // implementation project(":myproject")

    // Gradle 依赖管理文档：
    // https://docs.gradle.org/current/userguide/dependency_management.html
}

/*
 * neoforge.mods.toml 放在 templates 中，因为其中包含项目属性占位符。
 * ProcessResources 会展开所有占位符；模板引用不存在的属性会让构建立即失败，
 * 这能防止发布带有未替换元数据的 JAR。
 */
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    // 把属性声明为任务输入，使 Gradle 能正确判断任务是否需要重新执行。
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// 将生成的元数据作为主资源输入，保证 IDE 运行和正式构建使用同一份结果。
sourceSets.main.resources.srcDir generateModMetadata

// IDE 每次同步项目时生成元数据，无需开发者手动运行任务。
neoForge.ideSyncTask generateModMetadata

// Maven 发布示例。默认写入项目内的 repo 目录，真实发布时应替换为目标仓库及凭据配置。
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    // 源文件含中文注释与日志文本，必须固定 UTF-8，避免不同系统默认编码导致编译失败。
    options.encoding = 'UTF-8'
}

idea {
    module {
        // IntelliJ 新版本不总会自动获取依赖源码/Javadoc；显式启用以改善跳转和悬停文档。
        downloadSources = true
        downloadJavadoc = true
    }
}
