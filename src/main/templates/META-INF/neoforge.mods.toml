# NeoForge 在加载模组前会读取本文件。它描述“模组是什么、依赖谁、在哪些环境可加载”，
# 不负责注册方块或事件；实际入口由下面的 modId 与 Java 中的 @Mod 注解关联。
# 本文件采用 TOML 0.5.0 语法。下方形如“美元符号 + 花括号”的占位符会由 build.gradle 的
# generateModMetadata 任务用 gradle.properties 中的值替换，请勿误当成 TOML 变量。

# 发布许可证，必填。选择许可证时需确认代码和资源是否允许再分发。
license="${mod_license}"

# 用户报告问题的地址，可选。正式发布时建议启用并换成真实地址。
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/"

# 一个 JAR 可以声明多个 [[mods]]；本示例只有一个模组。
[[mods]]

# 必须与 ImmortalityTotemMod.MODID、资源命名空间和 gradle.properties 的 mod_id 一致。
modId="${mod_id}"

# 显示与依赖比较所用的模组版本。
version="${mod_version}"

# 模组列表中显示的易读名称。
displayName="${mod_name}"

# NeoForge 更新检查器读取的 JSON 地址，可选。
#updateJSONURL="https://change.me.example.invalid/updates.json"

# 模组主页，可选。
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/"

# JAR 根目录中的徽标文件，可选；不是 assets 目录中的纹理路径。
logoFile="immortalitytotem.png"

# 模组列表中的鸣谢与作者信息，可选。
#credits=""
#authors=""

# 模组描述，三引号允许多行文本。
description='''
加入 1 个不死图腾 + 6 个金块 + 1 个钻石 + 1 个紫水晶碎片合成的永生图腾。
它位于玩家物品栏或末影箱时阻止所有标准死亡路径；由非玩家生物手持时则按普通不死图腾工作。
主手长按右键可引导三秒后传送回当前出生点，中途松开或切换物品会打断引导。
开始引导会立即获得 20 点 Exhaustion 并施加虚弱 V；引导结束时无论是否完成都会叠加失明 I。
成功传送后图腾会进入 180 tick 冷却，期间仅无法再次右键引导。
'''

# 使用 Mixin 时声明配置文件；不要只取消注释而不提供对应 JSON。
[[mixins]]
config="${mod_id}.mixins.json"

# Access Transformer 可修改 Minecraft 成员的访问级别。
# 若省略此块，NeoForge 仍会尝试自动查找 META-INF/accesstransformer.cfg。
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# Coremod 配置路径固定为 META-INF/coremods.json，无需在这里声明。

# 每个 [[dependencies.<modId>]] 描述当前模组的一项依赖约束。
[[dependencies.${mod_id}]]
    modId="neoforge"
    # required：缺少即拒绝加载；optional：可有可无；
    # incompatible：存在即拒绝加载；discouraged：存在时显示警告。
    type="required"
    # 可选的人类可读原因，适合解释不兼容关系。
    #reason="..."
    # Maven 风格区间 [a,b)：包含 a，不包含 b；这里只有下限。
    versionRange="[${neo_version},)"
    # BEFORE/AFTER 只表达有实际需要的加载顺序，NONE 表示无顺序要求。
    ordering="NONE"
    # BOTH 表示客户端和服务端都必须满足此依赖。
    side="BOTH"

# Minecraft 本身也是依赖项；范围必须与编译目标兼容。
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# features 用于声明运行环境能力。下面示例若启用，仅约束客户端 OpenGL 版本，
# 不会阻止无图形环境的专用服务器加载。
#[features.${mod_id}]
#openGLVersion="[3.2,)"
